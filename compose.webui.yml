services:
  qgroundcontrol_novnc:
    build:
      context: ./GCS
      dockerfile: Dockerfile.qgc-novnc
    container_name: dah-qgc-novnc
    network_mode: host
    ipc: host
    environment:
      - LIBGL_ALWAYS_SOFTWARE=${LIBGL_ALWAYS_SOFTWARE:-1}
    volumes:
      - ./GCS/data:/home/qgc/.config/QGroundControl.org:rw
    restart: unless-stopped

  rosbot_sim_novnc:
    build:
      context: ./UGV
      dockerfile: Dockerfile.ugv-novnc
    container_name: dah-rosbot-sim-novnc
    network_mode: host
    ipc: host
    environment:
      - ROS_DOMAIN_ID=${ROS_DOMAIN_ID:-17}
      - ROBOT_MODEL=${ROBOT_MODEL:-rosbot}
      - LIBGL_ALWAYS_SOFTWARE=${LIBGL_ALWAYS_SOFTWARE:-1}
    restart: unless-stopped

  rviz_novnc:
    build:
      context: ./UGV
      dockerfile: Dockerfile.rviz-novnc
    container_name: dah-rviz-novnc
    network_mode: host
    ipc: host
    environment:
      - ROS_DOMAIN_ID=${ROS_DOMAIN_ID:-17}
      - LIBGL_ALWAYS_SOFTWARE=${LIBGL_ALWAYS_SOFTWARE:-1}
    depends_on:
      - rosbot_sim_novnc
    restart: unless-stopped

  bridge:
    build:
      context: ./Bridge
      dockerfile: Dockerfile.bridge
    container_name: dah-bridge
    network_mode: host
    ipc: host
    environment:
      - ROS_DOMAIN_ID=${ROS_DOMAIN_ID:-17}
      - QGC_IP=${QGC_IP:-127.0.0.1}
      - QGC_PORT=${QGC_PORT:-14550}
      - BRIDGE_LOCAL_PORT=${BRIDGE_LOCAL_PORT:-14551}
      - MAV_SYS_ID=${MAV_SYS_ID:-1}
      - MAV_COMP_ID=${MAV_COMP_ID:-1}
      - MAX_LINEAR=${MAX_LINEAR:-0.5}
      - MAX_ANGULAR=${MAX_ANGULAR:-1.2}
      - CMD_TIMEOUT=${CMD_TIMEOUT:-0.6}
      - BASE_LAT=${BASE_LAT:-37.5665}
      - BASE_LON=${BASE_LON:-126.9780}
      - BASE_ALT=${BASE_ALT:-50.0}
      - MAVLINK_DEBUG=${MAVLINK_DEBUG:-0}
      - MISSION_ALLOWED_COMMANDS=${MISSION_ALLOWED_COMMANDS:-16,20}
      - MISSION_MAX_ALT_M=${MISSION_MAX_ALT_M:-200}
      - MISSION_MIN_ALT_M=${MISSION_MIN_ALT_M:--20}
      - MISSION_MAX_JUMP_M=${MISSION_MAX_JUMP_M:-120}
      - MISSION_GEOFENCE_RADIUS_M=${MISSION_GEOFENCE_RADIUS_M:-300}
      - MISSION_MAX_ITEMS=${MISSION_MAX_ITEMS:-20}
      - MISSION_AUDIT_LOG=${MISSION_AUDIT_LOG:-/logs/mission_audit.log}
    volumes:
      - ./Bridge:/app:ro
      - ./Bridge/logs:/logs:rw
    depends_on:
      - qgroundcontrol_novnc
      - rosbot_sim_novnc
    restart: unless-stopped
