services:
  qgroundcontrol_novnc:
    build:
      context: ./GCS
      dockerfile: Dockerfile.qgc-novnc
    container_name: dah-qgc-novnc
    network_mode: host
    environment:
      - LIBGL_ALWAYS_SOFTWARE=${LIBGL_ALWAYS_SOFTWARE:-1}
    volumes:
      - ./GCS/data:/home/qgc/.config/QGroundControl.org:rw
    restart: unless-stopped

  rosbot_sim_novnc:
    build:
      context: ./UGV
      dockerfile: Dockerfile.ugv-novnc
    container_name: dah-rosbot-sim-novnc
    network_mode: host
    ipc: host
    environment:
      - ROS_DOMAIN_ID=${ROS_DOMAIN_ID:-17}
      - ROBOT_MODEL=${ROBOT_MODEL:-rosbot_xl}
      - ROBOT_CONFIGURATION=${ROBOT_CONFIGURATION:-autonomy}
      - LIBGL_ALWAYS_SOFTWARE=${LIBGL_ALWAYS_SOFTWARE:-1}
    restart: unless-stopped

  rviz_novnc:
    build:
      context: ./UGV
      dockerfile: Dockerfile.rviz-novnc
    container_name: dah-rviz-novnc
    network_mode: host
    ipc: host
    environment:
      - ROS_DOMAIN_ID=${ROS_DOMAIN_ID:-17}
      - LIBGL_ALWAYS_SOFTWARE=${LIBGL_ALWAYS_SOFTWARE:-1}
    depends_on:
      - rosbot_sim_novnc
    restart: unless-stopped

  bridge:
    build:
      context: ./Bridge
      dockerfile: Dockerfile.bridge
    container_name: dah-bridge
    network_mode: host
    ipc: host
    environment:
      - ROS_DOMAIN_ID=${ROS_DOMAIN_ID:-17}
      - QGC_IP=${QGC_IP:-127.0.0.1}
      - QGC_PORT=${QGC_PORT:-14550}
      - BRIDGE_LOCAL_PORT=${BRIDGE_LOCAL_PORT:-14551}
      - MAV_SYS_ID=${MAV_SYS_ID:-1}
      - MAV_COMP_ID=${MAV_COMP_ID:-1}
      - MAX_LINEAR=${MAX_LINEAR:-0.5}
      - MAX_ANGULAR=${MAX_ANGULAR:-1.2}
      - CMD_TIMEOUT=${CMD_TIMEOUT:-0.6}
      - BASE_LAT=${BASE_LAT:-37.5665}
      - BASE_LON=${BASE_LON:-126.9780}
      - BASE_ALT=${BASE_ALT:-50.0}
      - MAVLINK_DEBUG=${MAVLINK_DEBUG:-0}
      - MISSION_ALLOWED_COMMANDS=${MISSION_ALLOWED_COMMANDS:-16,20}
      - GNSS_MAX_HACC_M=${GNSS_MAX_HACC_M:-15}
      - COMMAND_HIGH_ANGULAR_RADPS=${COMMAND_HIGH_ANGULAR_RADPS:-1.50}
      - COMMAND_HIGH_LINEAR_MPS=${COMMAND_HIGH_LINEAR_MPS:-0.60}
      - CORRELATION_WEIGHT_HIGH_COMMAND=${CORRELATION_WEIGHT_HIGH_COMMAND:-0.35}
      - CORRELATION_WEIGHT_GNSS_REJECTED=${CORRELATION_WEIGHT_GNSS_REJECTED:-0.75}
      - CORRELATION_WEIGHT_MISSION_REJECTED=${CORRELATION_WEIGHT_MISSION_REJECTED:-0.75}
      - CORRELATION_HOLD_SECONDS=${CORRELATION_HOLD_SECONDS:-5}
      - CORRELATION_RISK_THRESHOLD=${CORRELATION_RISK_THRESHOLD:-0.75}
      - CORRELATION_SIGNAL_TTL_S=${CORRELATION_SIGNAL_TTL_S:-20}
      - CORRELATION_LOG=${CORRELATION_LOG:-/logs/correlation_event.log}
      - GNSS_MIN_SATELLITES=${GNSS_MIN_SATELLITES:-6}
      - GNSS_MIN_FIX_TYPE=${GNSS_MIN_FIX_TYPE:-3}
      - GNSS_MAX_RESIDUAL_M=${GNSS_MAX_RESIDUAL_M:-30}
      - GNSS_INTEGRITY_LOG=${GNSS_INTEGRITY_LOG:-/logs/gnss_integrity.log}
      - MISSION_MAX_ALT_M=${MISSION_MAX_ALT_M:-200}
      - MISSION_MIN_ALT_M=${MISSION_MIN_ALT_M:--20}
      - MISSION_MAX_JUMP_M=${MISSION_MAX_JUMP_M:-120}
      - MISSION_GEOFENCE_RADIUS_M=${MISSION_GEOFENCE_RADIUS_M:-300}
      - MISSION_MAX_ITEMS=${MISSION_MAX_ITEMS:-20}
      - MISSION_AUDIT_LOG=${MISSION_AUDIT_LOG:-/logs/mission_audit.log}
      # LLM reasoning backend for the agent layer. Compose interpolates these from
      # the project .env (gitignored); empty defaults keep the bridge working when
      # no key is set (agent falls back to the deterministic template).
      - AGENT_LLM_MODEL=${AGENT_LLM_MODEL:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
    volumes:
      - ./Bridge:/app:ro
      - ./Bridge/logs:/logs:rw
      # AI agent layer, run on demand via agents/run_live.sh (docker exec).
      # ./agents and ./Bridge are mounted as siblings under /workspace so the
      # agent package imports cleanly and Adapter C finds Bridge/tools/*.py
      # (agents/attack/adapter_c_mavlink.py resolves REPO_ROOT = parents[2]).
      # agents is rw so run traces / incident reports land back on the host.
      # demo holds the standalone attack PoCs that the live A/B adapters invoke.
      - ./agents:/workspace/agents:rw
      - ./Bridge:/workspace/Bridge:ro
      - ./demo:/workspace/demo:ro
    depends_on:
      - qgroundcontrol_novnc
      - rosbot_sim_novnc
    restart: unless-stopped
